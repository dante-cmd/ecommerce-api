# Live-client overlay: adds Mailpit (SMTP catcher) and a one-shot client
# container that exercises the API over real HTTP (see app/scripts/live_client.py).
#
# Usage (together with the main compose file):
#
#   docker compose -f docker-compose.yml -f docker-compose.client.yml up --build
#
# Then watch the client logs:
#
#   docker compose -f docker-compose.yml -f docker-compose.client.yml logs -f client
#
# And inspect the emails the API actually sent (verification, order updates):
#
#   open http://localhost:8025
#
# The client container runs once and exits; `docker compose ... up` again to
# replay the whole customer journey.

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    # fastmail sends with USE_CREDENTIALS=True; make Mailpit accept any auth
    # over plain SMTP (port 1025 has no TLS).
    command: --smtp-auth-accept-any --smtp-auth-allow-insecure
    ports:
      - "8025:8025" # Web UI + API
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redirect outgoing mail from the API and the Celery worker to Mailpit.
  # `environment` values take precedence over the `.env` file (MAIL_SERVER=smtp.example.com).
  api:
    environment:
      - MAIL_SERVER=mailpit
      - MAIL_PORT=1025
      - MAIL_STARTTLS=False
      - MAIL_SSL_TLS=False

  worker:
    environment:
      - MAIL_SERVER=mailpit
      - MAIL_PORT=1025
      - MAIL_STARTTLS=False
      - MAIL_SSL_TLS=False

  # The scheduled simulation (beat runs run_client_simulation every 5s) must
  # stay off in the live-client environment: the real client is the only
  # source of traffic. Attach it to a profile so it never starts here.
  beat:
    profiles: ["simulation"]

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce-client
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - MAILPIT_URL=http://mailpit:8025
      - ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
    command: python -m app.scripts.live_client
