services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker:/backup:ro
      - ./docker/restore-backup.sh:/docker-entrypoint-initdb.d/restore.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # networks:
    #  - common_network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ecommerce-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: ecommerce-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb local/${MINIO_BUCKET_NAME:-ecommerce-media} || true;
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET_NAME:-ecommerce-media} || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ecommerce}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./app:/app/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ecommerce-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ecommerce}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: >
      sh -c "celery -A app.tasks.celery_app worker -l info -Q default,emails,orders"

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # --- Optional dev helpers (start with: docker compose --profile mailpit
  #     --profile stripe up -d) ---

  # SMTP catcher for local email testing. To make the API/worker deliver
  # into it, set in .env: MAIL_SERVER=mailpit, MAIL_PORT=1025,
  # MAIL_STARTTLS=False, MAIL_SSL_TLS=False.
  # The simulation script picks it up via MAILPIT_URL.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    profiles: ["mailpit"]
    command: --smtp-auth-accept-any --smtp-auth-allow-insecure
    ports:
      - "8025:8025" # Web UI + API
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Official Stripe API mock (https://github.com/stripe/stripe-mock).
  # Point the app at it with STRIPE_API_BASE=http://stripe-mock:12111 in .env.
  stripe-mock:
    image: stripemock/stripe-mock:latest
    container_name: ecommerce-stripe-mock
    profiles: ["stripe"]
    ports:
      - "12111:12111" # HTTP
      - "12112:12112" # HTTPS

volumes:
  postgres_data:
  minio_data:


